[project]
name = "pipeline"
version = "0.1.0"
description = "Data pipeline code for IMPISH"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "asdf-astropy>=0.11.0",
    "astropy>=8.0.1",
    "impisc",
    "ipykernel>=7.3.0",
    "lz4>=4.4.5",
    "matplotlib>=3.11.1",
    "numpy>=2.5.2",
]

[tool.setuptools]
packages = [
    "pipeline",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "ruff>=0.16.5",
]

[tool.uv.sources]
impisc = { git = "https://github.com/umn-impish/impisc.git" }

[project.scripts]
getdoy = "pipeline.scripts:get_doy.main"
lvl1 = "pipeline.scripts:level1.main"
